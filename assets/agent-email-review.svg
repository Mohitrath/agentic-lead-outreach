<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#f4f7fb"/><rect x="70" y="55" width="1260" height="710" rx="24" fill="#ffffff" stroke="#dce3ee"/><rect x="70" y="55" width="1260" height="80" rx="24" fill="#101827"/><text x="105" y="105" font-family="Arial" font-size="25" fill="#ffffff" font-weight="700">Agent Review • Personalized Outreach</text><rect x="105" y="170" width="360" height="530" rx="18" fill="#f7f9fc" stroke="#e2e8f0"/><text x="135" y="212" font-family="Arial" font-size="14" fill="#64748b">LEAD</text><text x="135" y="250" font-family="Arial" font-size="25" fill="#0f172a" font-weight="700">Zen Market Group</text><text x="135" y="284" font-family="Arial" font-size="15" fill="#64748b">London, United Kingdom</text><rect x="135" y="320" width="285" height="52" rx="12" fill="#e9f9f3"/><text x="155" y="352" font-family="Arial" font-size="16" fill="#087f5b" font-weight="700">Fit score 0.88</text><text x="135" y="416" font-family="Arial" font-size="14" fill="#64748b">EVIDENCE</text><text x="135" y="448" font-family="Arial" font-size="14" fill="#1e293b">• Imports meditation products</text><text x="135" y="476" font-family="Arial" font-size="14" fill="#1e293b">• Serves wellness retailers</text><text x="135" y="504" font-family="Arial" font-size="14" fill="#1e293b">• Valid buyer contact</text><rect x="135" y="560" width="285" height="92" rx="12" fill="#fff7ed"/><text x="155" y="590" font-family="Arial" font-size="14" fill="#9a3412" font-weight="700">HUMAN APPROVAL</text><text x="155" y="618" font-family="Arial" font-size="13" fill="#7c2d12">Draft only — not sent</text><rect x="500" y="170" width="795" height="530" rx="18" fill="#ffffff" stroke="#e2e8f0"/><text x="535" y="212" font-family="Arial" font-size="14" fill="#64748b">OUTBOX DRAFT</text><text x="535" y="252" font-family="Arial" font-size="24" fill="#0f172a" font-weight="700">A tailored wholesale introduction</text><line x1="535" y1="278" x2="1260" y2="278" stroke="#e2e8f0"/><text x="535" y="320" font-family="Arial" font-size="15" fill="#334155">Subject: Tibetan singing bowls for your wellness assortment</text><text x="535" y="370" font-family="Arial" font-size="15" fill="#334155">Hi Zen Market Group,</text><text x="535" y="410" font-family="Arial" font-size="15" fill="#334155">I noticed your focus on meditation products and wellness retailers.</text><text x="535" y="442" font-family="Arial" font-size="15" fill="#334155">We work with international buyers looking for handcrafted Tibetan</text><text x="535" y="474" font-family="Arial" font-size="15" fill="#334155">singing bowls from India, with wholesale sourcing support.</text><text x="535" y="526" font-family="Arial" font-size="15" fill="#334155">Would you be open to a short conversation about your current range?</text><text x="535" y="578" font-family="Arial" font-size="15" fill="#334155">Best,</text><text x="535" y="610" font-family="Arial" font-size="15" fill="#334155">Export Team</text><rect x="535" y="642" width="150" height="38" rx="10" fill="#111827"/><text x="565" y="667" font-family="Arial" font-size="14" fill="#ffffff">Review draft</text><rect x="700" y="642" width="160" height="38" rx="10" fill="#e2e8f0"/><text x="728" y="667" font-family="Arial" font-size="14" fill="#334155">Reject</text></svg>